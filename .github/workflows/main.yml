name: Roblox Tracker Bot
on:
  schedule:
    - cron: '*/5 * * * *' # รันทุก 30 นาที
  workflow_dispatch: # ปุ่มกดรันเอง

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Tracker
        run: python script.py

      - name: Sync History
        run: |
          git config --global user.name 'AxelTrackerBot'
          git config --global user.email 'bot@axelhub.og'
          git add last_hash.txt last_future_hash.txt
          git commit -m "update: sync version history [skip ci]" || exit 0
          git push
