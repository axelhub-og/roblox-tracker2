name: Roblox Tracker Bot
on:
  schedule:
    - cron: '*/5 * * * *' # รันทุก 5 นาที
  workflow_dispatch: # ปุ่มกดรันเอง

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # อัปเดตเป็น v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5 # อัปเดตเป็น v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Tracker
        run: python script.py

      - name: Sync History
        run: |
          git config --global user.name 'AxelTrackerBot'
          git config --global user.email 'bot@axelhub.og'
          touch last_hash.txt last_future_hash.txt
          git add last_hash.txt last_future_hash.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: sync version history [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
