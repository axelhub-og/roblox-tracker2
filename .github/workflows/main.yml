name: Roblox Tracker Bot
on:
  schedule:
    - cron: '*/30 * * * *' # ตั้งค่ารันทุก 5 นาที (GitHub แพลนฟรีจะรันจริงทุก 15-30 นาที)
  workflow_dispatch: # สำหรับกดรันด้วยตนเองเพื่อทดสอบ

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Tracker
        run: |
          # รันไฟล์ script.py ตัวพิมพ์เล็กตามที่ระบุ
          if [ -f "script.py" ]; then
            python script.py
          else
            echo "Error: script.py not found!"
            exit 1
          fi

      - name: Sync History
        run: |
          git config --global user.name 'AxelTrackerBot'
          git config --global user.email 'bot@axelhub.og'
          touch last_hash.txt last_future_hash.txt
          git add last_hash.txt last_future_hash.txt
          if git diff --staged --quiet; then
            echo "No changes in version history."
          else
            git commit -m "update: sync version history [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
